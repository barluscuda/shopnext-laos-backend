name: shopnext-laos-tests
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: shopnext
      POSTGRES_PASSWORD: shopnext
      POSTGRES_DB: shopnext_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnext -d shopnext_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.1-alpine3.22
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases: ["shopnext-test-redis"]
  tests:
    image: shopnext-laos-tests:local
    build:
      context: .
      target: development
    environment:
      APP_ENV: test
      DATABASE_URL: postgres://shopnext:shopnext@postgres:5432/shopnext_test?sslmode=disable
      TEST_DATABASE_URL: postgres://shopnext:shopnext@postgres:5432/shopnext_test?sslmode=disable
      TEST_REDIS_URL: redis://shopnext-test-redis:6379/15
    command: ["sh", "-c", "go run ./cmd/migrate up && go test -tags nomsgpack -race ./tests/integration -count=1"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
