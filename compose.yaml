name: shopnext-laos
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: shopnext
      POSTGRES_PASSWORD: shopnext
      POSTGRES_DB: shopnext
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnext -d shopnext"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.1-alpine3.22
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    profiles: ["app"]
    command: ["migrate", "up"]
    environment: &app-env
      APP_ENV: development
      DATABASE_URL: postgres://shopnext:shopnext@postgres:5432/shopnext?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PAYMENT_PROVIDER: dev
      SMS_PROVIDER: dev
      UPLOAD_DIR: /app/data/uploads
      ALLOWED_ORIGINS: http://localhost:3000 http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    profiles: ["app"]
    environment: *app-env
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: .
    profiles: ["app"]
    command: ["worker"]
    environment: *app-env
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  uploads:
