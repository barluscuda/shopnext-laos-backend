    "/bills/{bill}/details": {
      "get": {
        "operationId": "get__bills__bill__details",
        "summary": "Protected full order details and trusted-device key",
        "tags": [
          "Shopping"
        ],
        "security": [
          {
            "PhoneVerificationKey": []
          },
          {
            "TrustDeviceKey": []
          }
        ],
        "parameters": [
          {
            "name": "bill",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Phone-Verification-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "OTP verification key, valid for three days and five protected operations. Exact checkout replays do not consume another use."
          },
          {
            "name": "X-Trust-Device-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Order-scoped trusted-device JWT. User-Agent must match the stored device. Valid for 30 days; it does not authorize another order."
          },
          {
            "name": "User-Agent",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Actual end-user device User-Agent forwarded by Next.js."
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/ClientBill"
                    }
                  },
                  "required": [
                    "data"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "502": {
            "$ref": "#/components/responses/Error502"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "description": "Requires an OTP key matching the recipient phone or a valid order-scoped trust JWT. OTP authorization consumes one use and issues a trust key. Trust authorization checks the stored User-Agent every time and does not consume an OTP use. No customer cookies are accepted. Next.js must forward the actual device User-Agent."
      }
    },
