  "webhooks": {
    "clientPaymentSucceeded": {
      "post": {
        "summary": "Signed payment success notification to the configured Next.js server",
        "description": "Queued atomically with payment approval and delivered by the worker. At least once delivery, up to eight attempts. Receiver deduplicates event_id and verifies hex HMAC-SHA256(secret, timestamp + \".\" + rawBody), with a five-minute timestamp window. Configure CLIENT_PAYMENT_WEBHOOK_URL and CLIENT_PAYMENT_WEBHOOK_SECRET. Production requires HTTPS.",
        "parameters": [
          {
            "name": "X-ShopNext-Event-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Same as body event_id."
          },
          {
            "name": "X-ShopNext-Timestamp",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Unix timestamp in seconds, refreshed on each delivery attempt."
          },
          {
            "name": "X-ShopNext-Signature",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Hex HMAC-SHA256."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClientPaymentEvent"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Event accepted; any 2xx stops retries."
          }
        }
      }
    }
  }
